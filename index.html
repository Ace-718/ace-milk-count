  --bg-card: rgba(8, 26, 14, 0.94);
  --bg-card-sub: rgba(14, 38, 22, 0.88);
  --bg-input: rgba(4, 16, 8, 0.95);
  --border-card: rgba(34, 197, 94, 0.22);
  --border-highlight: rgba(74, 222, 128, 0.45);
  --text-main: #f0fdf4;
  --text-sub: #86efac;
  --accent-emerald: #10b981;
  --accent-glow: #22c55e;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

button, summary, .action-btn, .btn-copy, .btn-share, .add-item-btn {
  touch-action: manipulation;
}

[hidden] { display: none !important; }

html {
  background-color: var(--bg-base);
  -webkit-text-size-adjust: 100%;
  scroll-padding-top: 12px;
  scroll-padding-bottom: 96px;
}

body {
  background-color: var(--bg-base);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  padding-top: max(16px, env(safe-area-inset-top, 16px) + 10px);
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(14px, env(safe-area-inset-left, 14px));
  padding-right: max(14px, env(safe-area-inset-right, 14px));
  max-width: 580px;
  margin: 0 auto;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overscroll-behavior-y: contain;
}

/* A fixed attachment repaints the whole backdrop on every scroll frame in iOS Safari;
   a pinned layer gets the same look without the stutter. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-color: var(--bg-base);
  background-image:
    radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(5, 46, 22, 0.6) 0%, transparent 60%);
}

/* Header */
header {
  text-align: center;
  margin-bottom: 16px;
  padding: 14px;
  background: linear-gradient(180deg, rgba(14, 38, 22, 0.98) 0%, rgba(6, 20, 10, 0.98) 100%);
  border: 1px solid var(--border-card);
  border-radius: 22px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 20px rgba(16, 185, 129, 0.08);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.brand-wrap { display: flex; align-items: center; justify-content: center; gap: 9px; }

.brand-icon-img {
  width: 40px; height: 40px;
  border-radius: 11px;
  border: 1.5px solid var(--accent-emerald);
  background-size: cover;
  background-position: center;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
  flex-shrink: 0;
  display: block;
}

.brand-title {
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: #fff;
  white-space: nowrap;
}

.header-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.lock-btn {
  border: 1px solid var(--border-card);
  background: rgba(4, 16, 8, 0.8);
  color: var(--text-sub);
  font-family: inherit;
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 9999px;
  cursor: pointer;
}

.lock-btn:active { background: rgba(34, 197, 94, 0.25); }

.badge-vip {
  background: rgba(34, 197, 94, 0.15);
  border: 1px solid rgba(34, 197, 94, 0.4);
  color: #4ade80;
  font-size: 0.66rem;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 9999px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

@media (max-width: 360px) {
  .brand-title { font-size: 0.95rem; }
  .brand-icon-img { width: 32px; height: 32px; border-radius: 9px; }
  .brand-wrap { gap: 6px; }
}

/* Auth */
.auth-card {
  max-width: 420px;
  margin: 32px auto 20px;
  text-align: center;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  padding: 32px 22px;
  border-radius: 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
}

.auth-icon-img {
  width: 84px; height: 84px;
  margin: 0 auto 18px;
  border-radius: 22px;
  border: 2px solid var(--accent-emerald);
  background-size: cover;
  background-position: center;
  box-shadow: 0 10px 30px rgba(16, 185, 129, 0.35);
  display: block;
}

.auth-title { font-size: 1.32rem; font-weight: 800; margin-bottom: 6px; }
.auth-desc { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 22px; }
.auth-error {
  color: #fca5a5;
  margin-top: 12px;
  font-size: 0.82rem;
  font-weight: 700;
}

/* Meta section */
.meta-section {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  padding: 14px;
  border-radius: 18px;
  margin-bottom: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 430px) { .meta-grid { grid-template-columns: 1fr; } }

.meta-field label {
  display: block;
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--text-sub);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

input[type="text"], input[type="password"] {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border-card);
  color: #fff;
  padding: 12px 14px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input:focus {
  outline: none;
  border-color: var(--accent-emerald);
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
}

/* Category grid */
.categories-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  align-items: start;
}
@media (max-width: 380px) { .categories-grid { gap: 8px; } }

details.category-group {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

details.category-group[open] {
  grid-column: 1 / -1;
  border-color: var(--border-highlight);
  box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 15px rgba(16, 185, 129, 0.1);
}

summary.category-title {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text-main);
  padding: 12px 10px;
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  user-select: none;
  background: linear-gradient(180deg, rgba(14, 40, 22, 0.7) 0%, rgba(6, 22, 11, 0.9) 100%);
  min-height: 62px;
}

summary.category-title::-webkit-details-marker { display: none; }
summary.category-title:hover { background: rgba(20, 52, 29, 0.85); }

.cat-title-text {
  display: inline-flex;
  flex-direction: column;
  line-height: 1.22;
  font-weight: 700;
  letter-spacing: -0.01em;
  word-break: break-word;
}


.summary-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

.cat-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  font-weight: 700;
  color: #052e16;
  background: var(--accent-glow);
  border-radius: 9999px;
  padding: 1px 7px;
  min-width: 20px;
  text-align: center;
}

.cat-icon-toggle {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-sub);
  font-size: 1.2rem;
  font-weight: 800;
  transition: transform 0.2s ease, color 0.2s ease;
}

details.category-group[open] > summary .cat-icon-toggle {
  transform: rotate(45deg);
  color: var(--accent-glow);
}

.category-content {
  padding: 10px 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: rgba(3, 13, 6, 0.75);
  border-top: 1px solid rgba(34, 197, 94, 0.15);
}

/* Sub items */
details.sub-item-group {
  background: var(--bg-card-sub);
  border: 1px solid rgba(34, 197, 94, 0.2);
  border-radius: 14px;
  overflow: hidden;
  transition: border-color 0.2s ease, background 0.2s ease;
}

details.sub-item-group[open] {
  border-color: rgba(74, 222, 128, 0.35);
  background: rgba(14, 42, 24, 0.95);
}

summary.sub-item-title {
  padding: 12px 14px;
  font-size: 0.93rem;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  user-select: none;
}

summary.sub-item-title::-webkit-details-marker { display: none; }

.sub-item-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.sub-item-label {
  min-width: 0;
  word-break: break-word;
}

.sub-item-toggle {
  color: var(--text-sub);
  font-weight: 800;
  display: inline-block;
  transition: transform 0.2s ease;
}

.btn-remove-item {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  border: 1px solid rgba(239, 68, 68, 0.28);
  background: rgba(239, 68, 68, 0.1);
  color: #fca5a5;
  font-size: 0.68rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.btn-remove-item:active { background: var(--danger); color: #fff; }

/* Add-item row at the bottom of each category */
.add-item-form {
  display: flex;
  gap: 7px;
  margin-top: 4px;
  padding-top: 10px;
  border-top: 1px dashed rgba(34, 197, 94, 0.2);
}

.add-item-input {
  flex: 1;
  min-width: 0;
  background: var(--bg-input);
  border: 1px solid var(--border-card);
  color: #fff;
  padding: 9px 11px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  outline: none;
}

.add-item-input:focus { border-color: var(--accent-emerald); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18); }
.add-item-input::placeholder { color: rgba(134, 239, 172, 0.45); font-weight: 500; }

.add-item-btn {
  flex-shrink: 0;
  background: rgba(34, 197, 94, 0.14);
  border: 1px solid rgba(34, 197, 94, 0.4);
  color: var(--accent-glow);
  border-radius: 10px;
  padding: 9px 13px;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
}

.add-item-btn:active { background: var(--accent-emerald); color: #030d06; }

details.sub-item-group[open] .sub-item-toggle { transform: rotate(45deg); }

.sub-item-content {
  padding: 10px 12px 12px;
  border-top: 1px solid rgba(34, 197, 94, 0.12);
  background: rgba(3, 14, 7, 0.85);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Batch rows */
.batch-wrapper {
  background: rgba(6, 24, 12, 0.9);
  border: 1px solid rgba(34, 197, 94, 0.25);
  border-radius: 12px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color 0.2s ease;
}

.batch-wrapper:focus-within { border-color: var(--accent-emerald); }

.batch-main-row { display: flex; align-items: center; gap: 7px; }

.qty-stepper-wrap {
  display: flex;
  align-items: center;
  background: rgba(2, 10, 5, 0.9);
  border: 1px solid var(--border-card);
  border-radius: 10px;
  padding: 2px;
  flex-shrink: 0;
}

.step-btn {
  background: transparent;
  border: none;
  color: var(--text-sub);
  width: 30px; height: 34px;
  font-size: 1.1rem;
  font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  border-radius: 7px;
  transition: background 0.15s ease, transform 0.15s ease;
}

.step-btn:active { background: var(--accent-emerald); color: #030d06; transform: scale(0.92); }

.batch-qty {
  width: 52px;
  text-align: center;
  border: none;
  background: transparent;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 1rem;
  font-weight: 700;
  outline: none;
  padding: 4px 0;
  -moz-appearance: textfield;
  appearance: textfield;
}

.batch-qty::-webkit-outer-spin-button,
.batch-qty::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.batch-qty.is-zero { color: #f87171; opacity: 0.85; }

.batch-unit {
  flex: 1;
  min-width: 0;
  background: rgba(3, 14, 7, 0.95);
  border: 1px solid var(--border-card);
  border-radius: 10px;
  color: var(--text-main);
  padding: 9px 8px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  outline: none;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, #4ade80 50%), linear-gradient(135deg, #4ade80 50%, transparent 50%);
  background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 24px;
  text-overflow: ellipsis;
}

.batch-unit:focus { border-color: var(--accent-emerald); }
.batch-unit option { background: #061a0c; color: #fff; }

.btn-remove {
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5;
  width: 34px; height: 34px;
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 800;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s ease;
}

.btn-remove:active { background: var(--danger); color: #fff; transform: scale(0.92); }

.date-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(3, 12, 6, 0.6);
  padding: 4px 10px;
  border-radius: 8px;
  border: 1px dashed rgba(34, 197, 94, 0.2);
}

.date-row span {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  flex-shrink: 0;
}

.batch-exp {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  font-weight: 600;
  outline: none;
  padding: 3px 0;
}

.batch-exp::placeholder { color: rgba(134, 239, 172, 0.4); }
.batch-exp.invalid { color: #fca5a5; }

.btn-add {
  background: rgba(34, 197, 94, 0.1);
  color: var(--accent-glow);
  border: 1px dashed rgba(34, 197, 94, 0.35);
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease;
  margin-top: 2px;
}

.btn-add:hover { background: rgba(34, 197, 94, 0.2); border-color: var(--accent-glow); }
.btn-add:active { transform: scale(0.98); }

/* Actions */
/* Docked to the bottom of the screen. A sticky bar shifts every time iOS Safari
   collapses its toolbars; a fixed one stays put. */
.actions-bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  width: min(calc(100% - 28px), 552px);
  z-index: 20;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: rgba(3, 13, 6, 0.97);
  border: 1px solid var(--border-card);
  box-shadow: 0 10px 30px rgba(0,0,0,0.55);
}

/* Fades the page out under the dock so cards never look half-cut behind it. */
.actions-bar::before {
  content: '';
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(-1 * (env(safe-area-inset-bottom, 0px) + 10px));
  width: 100vw;
  height: calc(100% + env(safe-area-inset-bottom, 0px) + 34px);
  background: linear-gradient(180deg, rgba(3, 13, 6, 0) 0%, rgba(3, 13, 6, 0.9) 55%, rgba(3, 13, 6, 0.99) 72%, var(--bg-base) 100%);
  z-index: -1;
  pointer-events: none;
}

.action-btn {
  padding: 15px 12px;
  border-radius: 13px;
  font-family: inherit;
  font-size: 0.93rem;
  font-weight: 800;
  cursor: pointer;
  border: none;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: filter 0.2s ease, transform 0.12s ease;
}

.action-btn:active { transform: scale(0.97); }

.btn-generate {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: #fff;
  box-shadow: 0 6px 18px rgba(16, 185, 129, 0.3);
}

.btn-generate:hover { filter: brightness(1.08); }

.btn-reset {
  background: rgba(239, 68, 68, 0.14);
  border: 1px solid rgba(239, 68, 68, 0.4);
  color: #fca5a5;
}

.btn-reset:hover { background: rgba(239, 68, 68, 0.24); }






/* Output */
.output-section {
  margin-top: 6px;
  scroll-margin-bottom: 110px;
  background: rgba(4, 16, 8, 0.95);
  border: 1px solid var(--border-card);
  border-radius: 18px;
  padding: 14px;
  display: none;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 20px rgba(16, 185, 129, 0.1);
}

.output-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.output-header-row > span {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.btn-edit-toggle {
  background: rgba(245, 158, 11, 0.15);
  color: #fbbf24;
  border: 1px solid rgba(245, 158, 11, 0.35);
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 0.75rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  flex-shrink: 0;
}

.btn-edit-toggle.editing {
  background: rgba(34, 197, 94, 0.2);
  color: #86efac;
  border-color: rgba(34, 197, 94, 0.45);
}

#outputPreview {
  width: 100%;
  height: 240px;
  padding: 12px;
  border: 1px solid rgba(34, 197, 94, 0.3);
  border-radius: 12px;
  background: #020a04;
  color: #f0fdf4;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  line-height: 1.5;
  white-space: pre;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  outline: none;
  margin-bottom: 10px;
  resize: vertical;
}

/* iOS zooms the whole page when a focused field is under 16px. */
@media (pointer: coarse) {
  .batch-unit, #outputPreview, select, textarea { font-size: 16px; }
}

#outputPreview:not([readonly]) {
  border-color: var(--warning);
  background: #140e02;
  color: #fef3c7;
}

.output-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn-copy, .btn-share {
  color: #fff;
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  font-size: 0.92rem;
  font-weight: 800;
  font-family: inherit;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: filter 0.2s ease, transform 0.12s ease;
}

.btn-copy { background: linear-gradient(135deg, #059669 0%, #047857 100%); box-shadow: 0 6px 18px rgba(5, 150, 105, 0.3); }
.btn-share { background: linear-gradient(135deg, #0e7490 0%, #155e75 100%); box-shadow: 0 6px 18px rgba(14, 116, 144, 0.3); }
.btn-copy:active, .btn-share:active { transform: scale(0.98); }
.btn-copy:hover, .btn-share:hover { filter: brightness(1.1); }

/* Toast */
.toast {
  position: fixed;
  bottom: calc(104px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(140px);
  background: #10b981;
  color: #fff;
  font-weight: 700;
  font-size: 0.88rem;
  padding: 12px 22px;
  border-radius: 9999px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 1000;
  pointer-events: none;
  max-width: 90vw;
  text-align: center;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* Narrow phones: quantity row on one line, unit picker full width below it. */
@media (max-width: 430px) {
  .batch-main-row { flex-wrap: wrap; }
  .qty-stepper-wrap { order: 1; }
  .btn-remove { order: 2; margin-left: auto; }
  .batch-unit { order: 3; flex: 1 0 100%; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- state ---------- */

const state = { location: '', date: '', batches: {}, custom: {}, openCats: [], openItems: [] };

const $ = (id) => document.getElementById(id);

function blankRow() { return { qty: '', unit: '', exp: '' }; }

/* Items the user added themselves, per category. */
function customItems(catId) {
  return state.custom[catId] || [];
}

function itemsFor(cat) {
  return cat.items.concat(customItems(cat.id));
}

function todayString() {
  const d = new Date();
  return `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
}

function normalizeRow(row) {
  const src = row && typeof row === 'object' ? row : {};
  return {
    qty: src.qty === undefined || src.qty === null ? '' : String(src.qty),
    unit: typeof src.unit === 'string' ? src.unit : '',
    exp: typeof src.exp === 'string' ? src.exp : ''
  };
}

function loadState() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (_) { saved = null; }

  state.location = saved && typeof saved.location === 'string' ? saved.location : '';
  state.date = saved && typeof saved.date === 'string' ? saved.date : todayString();
  state.openCats = saved && Array.isArray(saved.openCats) ? saved.openCats : [];
  state.openItems = saved && Array.isArray(saved.openItems) ? saved.openItems : [];

  const savedCustom = saved && saved.custom && typeof saved.custom === 'object' ? saved.custom : {};
  for (const cat of CATEGORIES) {
    const list = Array.isArray(savedCustom[cat.id]) ? savedCustom[cat.id] : [];
    state.custom[cat.id] = list
      .filter(entry => entry && typeof entry.id === 'string' && typeof entry.name === 'string' && entry.name.trim())
      .map(entry => ({ id: entry.id, name: entry.name.trim().slice(0, 40) }));
  }

  const savedBatches = saved && saved.batches && typeof saved.batches === 'object' ? saved.batches : {};
  for (const cat of CATEGORIES) {
    for (const item of itemsFor(cat)) {
      const rows = Array.isArray(savedBatches[item.id]) ? savedBatches[item.id].map(normalizeRow) : [];
      state.batches[item.id] = rows.length ? rows : [blankRow()];
    }
  }
}

let saveTimer = null;

function writeState() {
  clearTimeout(saveTimer);
  saveTimer = null;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      location: state.location,
      date: state.date,
      custom: state.custom,
      batches: state.batches,
      openCats: state.openCats,
      openItems: state.openItems
    }));
  } catch (err) {
    console.warn('Could not save counts', err);
  }
}

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeState, 200);
}

/* iOS suspends a backgrounded app and can kill it without warning, so anything still
   waiting on the debounce has to be written before the page goes away. */
function flushState() {
  if (saveTimer) writeState();
}

/* ---------- small helpers ---------- */

function showToast(message) {
  const toast = $('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function buzz(ms) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (_) {} }
}

function parseQty(value) {
  const n = parseFloat(String(value).replace(',', '.'));
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function formatQty(n) {
  return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
}

function formatDateInput(value) {
  const digits = String(value).replace(/\D/g, '').slice(0, 8);
  if (digits.length <= 2) return digits;
  if (digits.length <= 4) return `${digits.slice(0, 2)}/${digits.slice(2)}`;
  return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
}

function isValidDate(value) {
  const v = value.trim();
  if (!/^\d{2}\/\d{2}\/\d{4}$/.test(v)) return false;
  const [mm, dd, yyyy] = v.split('/').map(Number);
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return false;
  const d = new Date(yyyy, mm - 1, dd);
  return d.getMonth() === mm - 1 && d.getDate() === dd;
}

/* ---------- auth ---------- */

async function hashPassword(text) {
  if (window.crypto && window.crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  return 'fnv:' + fnv1a(text);
}

function fnv1a(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16);
}

function unlockApp() {
  $('authScreen').hidden = true;
  $('mainAppContent').hidden = false;
  $('lockBtn').hidden = false;
}

function lockApp() {
  try { localStorage.removeItem(AUTH_KEY); } catch (_) {}
  $('mainAppContent').hidden = true;
  $('lockBtn').hidden = true;
  $('authScreen').hidden = false;
  $('authError').hidden = true;
  $('passwordInput').value = '';
  $('passwordInput').focus();
}

async function verifyPassword() {
  const entered = $('passwordInput').value.trim();
  if (!entered) return;
  const hash = await hashPassword(entered.toLowerCase());
  if (hash === ACCESS_SHA256 || hash === ACCESS_FNV) {
    try { localStorage.setItem(AUTH_KEY, 'true'); } catch (_) {}
    $('authError').hidden = true;
    $('passwordInput').value = '';
    unlockApp();
  } else {
    $('authError').hidden = false;
    $('passwordInput').value = '';
    $('passwordInput').focus();
    buzz(60);
  }
}

/* ---------- rendering ---------- */

function unitOptions(selected) {
  return UNITS.map(u =>
    `<option value="${u}"${u === selected ? ' selected' : ''}>${u === '' ? '-- Select Unit --' : u}</option>`
  ).join('');
}

const categoryContent = new Map();

function renderCategories() {
  const frag = document.createDocumentFragment();

  for (const cat of CATEGORIES) {
    const details = document.createElement('details');
    details.className = 'category-group';
    details.open = state.openCats.includes(cat.id);

    const summary = document.createElement('summary');
    summary.className = 'category-title';
    summary.innerHTML = `
      <span class="cat-title-text">${cat.icon} ${cat.title}</span>
      <span class="summary-right">
        <span class="cat-count" data-count="${cat.id}" hidden></span>
        <span class="cat-icon-toggle">+</span>
      </span>`;
    details.appendChild(summary);

    details.addEventListener('toggle', () => {
      state.openCats = state.openCats.filter(id => id !== cat.id);
      if (details.open) state.openCats.push(cat.id);
      save();
    });

    const content = document.createElement('div');
    content.className = 'category-content';
    details.appendChild(content);
    categoryContent.set(cat.id, content);

    frag.appendChild(details);
  }

  $('appContainer').appendChild(frag);
  for (const cat of CATEGORIES) renderCategoryItems(cat);
  renderCounts();
}

function renderCategoryItems(cat) {
  const content = categoryContent.get(cat.id);
  if (!content) return;

  content.textContent = '';
  for (const item of itemsFor(cat)) content.appendChild(buildItem(cat, item));
  content.appendChild(buildAddItemForm(cat));
  renderCounts();
}

const SINGULARS = {
  'Cold Milks': 'Cold Milk',
  'Alternative Milks': 'Alternative Milk',
  'CHAI': 'CHAI',
  'Kombucha': 'Kombucha',
  'Spindrift': 'Spindrift',
  'Syrups': 'Syrup',
  'Lenka Bars': 'Lenka Bar',
  'Pure Greens': 'Pure Green',
  'Bottle Drinks': 'Bottle Drink',
  'Sugars': 'Sugar',
  'Powder Items': 'Powder'
};

function singular(title) {
  return SINGULARS[title] || title;
}

function buildAddItemForm(cat) {
  const form = document.createElement('form');
  form.className = 'add-item-form';
  form.innerHTML = `
    <input type="text" class="add-item-input" placeholder="New ${singular(cat.title)} item…"
           maxlength="40" autocomplete="off" enterkeyhint="done" aria-label="New item name">
    <button type="submit" class="add-item-btn">➕ Add Item</button>`;

  const input = form.querySelector('.add-item-input');

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    addCustomItem(cat, input.value);
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') input.blur();
  });

  return form;
}

function addCustomItem(cat, rawName) {
  const name = String(rawName || '').trim().replace(/\s+/g, ' ').slice(0, 40);
  if (!name) return;

  const taken = itemsFor(cat).some(item => item.name.toLowerCase() === name.toLowerCase());
  if (taken) {
    showToast(`“${name}” is already in ${cat.title}`);
    return;
  }

  const id = `custom-${cat.id}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  if (!state.custom[cat.id]) state.custom[cat.id] = [];
  state.custom[cat.id].push({ id, name });
  state.batches[id] = [blankRow()];

  renderCategoryItems(cat);
  save();
  buzz(10);
  showToast(`Added “${name}”`);

  const added = categoryContent.get(cat.id).querySelector(`[data-item="${id}"]`);
  if (added) {
    added.open = true;
    if (!state.openItems.includes(id)) state.openItems.push(id);
    added.scrollIntoView({ behavior: 'smooth', block: 'center' });
    save();
  }
}

function removeCustomItem(cat, item) {
  if (!confirm(`Remove “${item.name}” from ${cat.title}?`)) return;

  state.custom[cat.id] = customItems(cat.id).filter(entry => entry.id !== item.id);
  delete state.batches[item.id];
  state.openItems = state.openItems.filter(id => id !== item.id);

  renderCategoryItems(cat);
  save();
  showToast(`Removed “${item.name}”`);
}

function buildItem(cat, item) {
  const details = document.createElement('details');
  details.className = 'sub-item-group';
  details.dataset.item = item.id;
  details.open = state.openItems.includes(item.id);

  const isCustom = !cat.items.some(base => base.id === item.id);

  const summary = document.createElement('summary');
  summary.className = 'sub-item-title';
  const label = document.createElement('span');
  label.className = 'sub-item-label';
  label.textContent = item.name;
  const right = document.createElement('span');
  right.className = 'sub-item-right';
  if (isCustom) {
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'btn-remove-item';
    del.textContent = '🗑';
    del.title = 'Remove this item';
    del.setAttribute('aria-label', `Remove ${item.name}`);
    del.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      removeCustomItem(cat, item);
    });
    right.appendChild(del);
  }
  const toggle = document.createElement('span');
  toggle.className = 'sub-item-toggle';
  toggle.textContent = '+';
  right.appendChild(toggle);
  summary.append(label, right);
  details.appendChild(summary);

  details.addEventListener('toggle', () => {
    state.openItems = state.openItems.filter(id => id !== item.id);
    if (details.open) state.openItems.push(item.id);
    save();
  });

  const content = document.createElement('div');
  content.className = 'sub-item-content';

  const rows = document.createElement('div');
  rows.className = 'rows';
  content.appendChild(rows);

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'btn-add';
  addBtn.textContent = '➕ Add Batch';
  addBtn.addEventListener('click', () => {
    state.batches[item.id].push(blankRow());
    renderRows(rows, item.id, cat.expires);
    save();
    buzz(8);
  });
  content.appendChild(addBtn);

  details.appendChild(content);
  renderRows(rows, item.id, cat.expires);
  return details;
}

function renderRows(host, itemId, withExpiry) {
  host.textContent = '';
  const rows = state.batches[itemId] || [];

  rows.forEach((row, index) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'batch-wrapper';
    wrapper.innerHTML = `
      <div class="batch-main-row">
        <div class="qty-stepper-wrap">
          <button type="button" class="step-btn" data-step="-1" aria-label="Decrease quantity">−</button>
          <input type="number" class="batch-qty${parseQty(row.qty) ? '' : ' is-zero'}" inputmode="decimal"
                 step="1" min="0" placeholder="0" value="${row.qty}" aria-label="Quantity">
          <button type="button" class="step-btn" data-step="1" aria-label="Increase quantity">+</button>
        </div>
        <select class="batch-unit" aria-label="Unit">${unitOptions(row.unit)}</select>
        <button type="button" class="btn-remove" title="Delete batch" aria-label="Delete batch">✕</button>
      </div>
      ${withExpiry ? `
      <div class="date-row">
        <span>Exp</span>
        <input type="text" class="batch-exp${row.exp && !isValidDate(row.exp) ? ' invalid' : ''}"
               inputmode="numeric" maxlength="10" placeholder="MM/DD/YYYY" value="${row.exp}"
               aria-label="Expiration date">
      </div>` : ''}`;

    const qtyInput = wrapper.querySelector('.batch-qty');
    qtyInput.addEventListener('input', () => {
      row.qty = qtyInput.value;
      qtyInput.classList.toggle('is-zero', !parseQty(qtyInput.value));
      renderCounts();
      save();
    });
    qtyInput.addEventListener('blur', () => {
      const n = parseQty(qtyInput.value);
      row.qty = n ? formatQty(n) : '';
      qtyInput.value = row.qty;
      qtyInput.classList.toggle('is-zero', !n);
      renderCounts();
      save();
    });

    wrapper.querySelectorAll('.step-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const next = Math.max(0, (parseQty(row.qty) || 0) + Number(btn.dataset.step));
        row.qty = next ? formatQty(next) : '';
        qtyInput.value = row.qty;
        qtyInput.classList.toggle('is-zero', !next);
        renderCounts();
        save();
        buzz(8);
      });
    });

    const unitSelect = wrapper.querySelector('.batch-unit');
    unitSelect.addEventListener('change', () => {
      row.unit = unitSelect.value;
      save();
    });

    const expInput = wrapper.querySelector('.batch-exp');
    if (expInput) {
      expInput.addEventListener('input', () => {
        const formatted = formatDateInput(expInput.value);
        if (formatted !== expInput.value) expInput.value = formatted;
        row.exp = formatted;
        expInput.classList.toggle('invalid', formatted !== '' && !isValidDate(formatted));
        save();
      });
    }

    wrapper.querySelector('.btn-remove').addEventListener('click', () => {
      if (rows.length > 1) {
        rows.splice(index, 1);
      } else {
        rows[0] = blankRow();
      }
      renderRows(host, itemId, withExpiry);
      renderCounts();
      save();
    });

    host.appendChild(wrapper);
  });
}

function renderCounts() {
  for (const cat of CATEGORIES) {
    const badge = document.querySelector(`[data-count="${cat.id}"]`);
    if (!badge) continue;
    let count = 0;
    for (const item of itemsFor(cat)) {
      for (const row of state.batches[item.id] || []) {
        if (parseQty(row.qty) > 0) count++;
      }
    }
    badge.textContent = count ? String(count) : '';
    badge.hidden = count === 0;
  }
}

/* ---------- export ---------- */

function itemEntries(item, withExpiry) {
  const parts = [];
  for (const row of state.batches[item.id] || []) {
    const qty = parseQty(row.qty);
    if (!qty) continue;
    let text = `${formatQty(qty)}${row.unit ? ' ' + row.unit : ''}`;
    if (withExpiry && row.exp) text += ` (Exp: ${row.exp})`;
    parts.push(text);
  }
  return parts;
}

function buildTemplate() {
  const location = $('locationInput').value.trim() || 'Unspecified Location';
  const date = $('dateInput').value.trim() || todayString();
  const lines = [
    '🥛 Milk Count 🥛',
    '===============',
    '',
    `🏪 Location: ${location}`,
    '---------------------',
    `🗓️  Date: ${date}`,
    '================',
    '',
    ''
  ];

  for (const cat of CATEGORIES) {
    const body = [];

    if (cat.style === 'aligned') {
      const items = itemsFor(cat);
      const labelWidth = Math.max(...items.map(item => item.name.length));
      for (const item of items) {
        const entries = itemEntries(item, cat.expires);
        if (entries.length) body.push(`${item.name.padEnd(labelWidth)} - ${entries.join(', ')}`);
      }
    } else if (cat.style === 'multiline') {
      for (const item of itemsFor(cat)) {
        for (const entry of itemEntries(item, cat.expires)) body.push(`${item.name} - ${entry}`);
      }
    } else {
      for (const item of itemsFor(cat)) {
        const entries = itemEntries(item, cat.expires);
        if (entries.length) body.push(`${item.name} - ${entries.join(', ')}`);
      }
    }

    if (!body.length) continue;

    lines.push('~~~~~~~~~~~~~~~~~~~~~~~~~', '~~~~~~~~~~~~~~~~~~~~~~~~~', '');
    lines.push(cat.exportTitle || cat.title, cat.underline || '~~~~~~~~~~', '');
    lines.push(...body);
    lines.push('', '');
  }

  lines.push('~~~~~~~~~~~~~~~~~~~~~~~~~', '~~~~~~~~~~~~~~~~~~~~~~~~~');
  return lines.join('\n');
}

function generateTemplate() {
  const output = buildTemplate();
  const section = $('outputSection');
  $('outputPreview').value = output;
  section.style.display = 'block';

  const active = document.activeElement;
  if (active && typeof active.blur === 'function') active.blur();

  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- actions ---------- */

async function copyTemplate() {
  const preview = $('outputPreview');
  if (!preview.value) { showToast('Generate the template first'); return; }

  let copied = false;
  try {
    await navigator.clipboard.writeText(preview.value);
    copied = true;
  } catch (_) {
    const readonly = preview.hasAttribute('readonly');
    preview.removeAttribute('readonly');
    preview.select();
    try { copied = document.execCommand('copy'); } catch (_) { copied = false; }
    if (readonly) preview.setAttribute('readonly', 'true');
    preview.blur();
  }
  showToast(copied ? '✅ Copied to clipboard' : '⚠️ Select the text and copy manually');
}

async function shareTemplate() {
  const text = $('outputPreview').value;
  if (!text) { showToast('Generate the template first'); return; }
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Milk Count', text });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }
  await copyTemplate();
}

function toggleEdit() {
  const preview = $('outputPreview');
  const btn = $('editToggleBtn');
  const editing = !preview.hasAttribute('readonly');
  if (editing) {
    preview.setAttribute('readonly', 'true');
    btn.textContent = '✏️ Enable Edit';
    btn.classList.remove('editing');
  } else {
    preview.removeAttribute('readonly');
    btn.textContent = '🔒 Lock Edit';
    btn.classList.add('editing');
    preview.focus();
  }
}

function resetCounts() {
  if (!confirm('Reset every batch counter to zero?')) return;
  for (const cat of CATEGORIES) {
    for (const item of itemsFor(cat)) state.batches[item.id] = [blankRow()];
  }
  renderAll();
  $('outputSection').style.display = 'none';
  showToast('↺ All counters reset');
}

/* ---------- wiring ---------- */

function renderAll() {
  $('appContainer').textContent = '';
  renderCategories();
}

/* In the single-file build the artwork is embedded, so icons and the manifest are
   wired up here instead of coming from separate files. */
/* iOS scrolls the page sideways when the on-screen keyboard opens and does not always
   put it back; clamping the horizontal offset keeps the app square. */
function watchScrollDrift() {
  window.addEventListener('scroll', () => {
    if (window.scrollX !== 0) window.scrollTo(0, window.scrollY);
  }, { passive: true });
}

/* Keeps the installed app usable with no signal. The single-file build skips this,
   since it has no separate files to cache. */
function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || window.MILK_ICONS) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

function applyIcons() {
  const icons = window.MILK_ICONS;
  if (!icons) return;

  document.querySelectorAll('.brand-icon-img, .auth-icon-img').forEach(el => {
    el.style.backgroundImage = `url("${icons.brand}")`;
  });

  const link = document.createElement('link');
  link.rel = 'icon';
  link.type = 'image/png';
  link.href = icons.favicon;
  document.head.appendChild(link);

  const touch = document.createElement('link');
  touch.rel = 'apple-touch-icon';
  touch.href = icons.brand;
  document.head.appendChild(touch);

  if (icons.manifest) {
    const manifest = document.createElement('link');
    manifest.rel = 'manifest';
    manifest.href = URL.createObjectURL(new Blob([JSON.stringify(icons.manifest)], { type: 'application/manifest+json' }));
    document.head.appendChild(manifest);
  }
}

function init() {
  applyIcons();
  watchScrollDrift();
  registerServiceWorker();
  loadState();

  $('locationInput').value = state.location;
  $('dateInput').value = state.date || todayString();

  $('locationInput').addEventListener('input', (e) => {
    state.location = e.target.value;
    save();
  });
  $('dateInput').addEventListener('input', (e) => {
    const formatted = formatDateInput(e.target.value);
    if (formatted !== e.target.value) e.target.value = formatted;
    state.date = formatted;
    save();
  });

  renderCategories();

  $('unlockBtn').addEventListener('click', verifyPassword);
  $('passwordInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') verifyPassword();
  });
  $('lockBtn').addEventListener('click', lockApp);
  $('generateBtn').addEventListener('click', generateTemplate);
  $('resetBtn').addEventListener('click', resetCounts);
  $('copyBtn').addEventListener('click', copyTemplate);
  $('shareBtn').addEventListener('click', shareTemplate);
  $('editToggleBtn').addEventListener('click', toggleEdit);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushState();
  });
  window.addEventListener('pagehide', flushState);
  window.addEventListener('beforeunload', flushState);

  // iOS restores a backgrounded page from its cache; inputs keep their old values,
  // so re-sync them with what is actually stored.
  window.addEventListener('pageshow', (event) => {
    if (!event.persisted) return;
    flushState();
    $('locationInput').value = state.location;
    $('dateInput').value = state.date || todayString();
  });

  let authed = false;
  try { authed = localStorage.getItem(AUTH_KEY) === 'true'; } catch (_) {}
  if (authed) unlockApp();
}

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
